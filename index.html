    <style>
        * { box-sizing: border-box; font-family: 'Kanit', sans-serif, Arial; }
        body { background: #f0f4f8; margin: 0; padding: 15px; text-align: center; color: #333; }
        h1 { color: #2c3e50; font-size: 22px; margin-bottom: 5px; }
        .filter-container { margin-bottom: 12px; }
        select { padding: 8px 12px; font-size: 16px; border-radius: 8px; border: 2px solid #3498db; font-weight: bold; color: #2c3e50; }
        .mode-btn { background: #3498db; color: white; border: none; padding: 10px 15px; margin: 3px; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .mode-btn.active { background: #2c3e50; }
        .card { background: white; border-radius: 15px; padding: 20px; margin: 15px auto; max-width: 400px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .flash-img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 10px; background: #eef2f3; }
        .word { font-size: 32px; font-weight: bold; color: #2e86de; margin: 5px 0; }
        .pos { color: #888; font-style: italic; font-size: 14px; }
        .meaning { font-size: 22px; color: #2d3436; margin: 10px 0; font-weight: bold; }
        .btn-sound { background: #10ac84; color: white; border: none; padding: 8px 16px; border-radius: 20px; font-size: 16px; cursor: pointer; margin-top: 5px; }
        .options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 15px; }
        .opt-btn { background: #f1f2f6; border: 2px solid #ced6e0; padding: 12px; border-radius: 8px; font-size: 16px; cursor: pointer; }
        .opt-btn:active { background: #dfe4ea; }
        input[type="text"] { width: 80%; padding: 10px; font-size: 18px; border: 2px solid #ccc; border-radius: 8px; text-align: center; margin-bottom: 10px; }
        .check-btn { background: #ff9f43; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; }
        .result { font-weight: bold; font-size: 18px; margin-top: 10px; height: 25px; }
        .nav-btn { background: #718093; color: white; border: none; padding: 8px 15px; border-radius: 5px; margin: 10px 5px; cursor: pointer; }
    </style>
</head>

    <h1>น้องซ้อมแข่ง: Vocab Practice</h1>
    
    <div class="filter-container">

    </div>

    <div>

    </div>

let vocabList = [...allVocab];
let currentIndex = 0;
let currentMode = 'flashcard';

function changeWeek() {
    const selectedWeek = document.getElementById('weekSelect').value;
    if (selectedWeek === 'all') {
        vocabList = [...allVocab];
    } else {
        vocabList = allVocab.filter(item => item.week === selectedWeek);
    }
    currentIndex = 0;
    render();
}

function speak(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    window.speechSynthesis.speak(utterance);
}

function render() {
    const card = document.getElementById('appCard');
    if (vocabList.length === 0) return;
    const item = vocabList[currentIndex];
    document.getElementById('progress').innerText = `${currentIndex + 1} / ${vocabList.length}`;

    if (currentMode === 'flashcard') {
        card.innerHTML = `
            <div style="color:#e67e22; font-size:12px; font-weight:bold; margin-bottom:5px;">[${item.week} - ${item.subject}]</div>
            <img class="flash-img" src="${item.img}" alt="${item.word}">
            <div class="word">${item.word}</div>
            <div class="pos">(${item.pos})</div>
            <button class="btn-sound" onclick="speak('${item.word}')">🔊 ฟังเสียงอ่าน</button>
            <hr style="margin:15px 0; border:0; border-top:1px solid #eee;">
            <div class="meaning">${item.meaning}</div>
        `;
    } else if (currentMode === 'choice') {
        let options = [item.meaning];
        while(options.length < Math.min(4, vocabList.length)) {
            let rand = vocabList[Math.floor(Math.random() * vocabList.length)].meaning;
            if(!options.includes(rand)) options.push(rand);
        }
        options.sort(() => Math.random() - 0.5);

        card.innerHTML = `
            <div style="color:#e67e22; font-size:12px; font-weight:bold; margin-bottom:5px;">[${item.week} - ${item.subject}]</div>
            <img class="flash-img" src="${item.img}" alt="${item.word}">
            <div class="word">${item.word}</div>
            <button class="btn-sound" onclick="speak('${item.word}')">🔊 ฟังเสียง</button>
            <p style="margin:10px 0 5px 0;">เลือกคำแปลที่ถูกต้อง:</p>
            <div class="options">
                ${options.map(opt => `<button class="opt-btn" onclick="checkChoice('${opt}', '${item.meaning}')">${opt}</button>`).join('')}
            </div>
            <div class="result" id="result"></div>
        `;
    } else if (currentMode === 'write') {
        card.innerHTML = `
            <div style="color:#e67e22; font-size:12px; font-weight:bold; margin-bottom:5px;">[${item.week} - ${item.subject}]</div>
            <img class="flash-img" src="${item.img}" alt="${item.word}">
            <div class="meaning">${item.meaning} (${item.pos})</div>
            <p style="margin:5px 0 10px 0;">พิมพ์คำศัพท์ภาษาอังกฤษ:</p>
            <input type="text" id="writeInput" placeholder="พิมพ์ที่นี่..." autocomplete="off">
            <br>
            <button class="check-btn" onclick="checkWrite('${item.word}')">ตรวจคำตอบ</button>
            <div class="result" id="result"></div>
        `;
    }
}

function checkChoice(selected, correct) {
    const res = document.getElementById('result');
    if (selected === correct) {
        res.innerHTML = "<span style='color:green;'>✓ ถูกต้อง!</span>";
        speak(vocabList[currentIndex].word);
    } else {
        res.innerHTML = "<span style='color:red;'>✗ ยังไม่ถูก ลองใหม่นะ</span>";
    }
}

function checkWrite(correct) {
    const input = document.getElementById('writeInput').value.trim().toLowerCase();
    const res = document.getElementById('result');
    if (input === correct.toLowerCase()) {
        res.innerHTML = "<span style='color:green;'>✓ เก่งมาก! สะกดถูกต้อง</span>";
        speak(correct);
    } else {
        res.innerHTML = `<span style='color:red;'>✗ คำที่ถูกคือ: ${correct}</span>`;
    }
}

function switchMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
    event.target.classList.add('active');
    render();
}

function nextWord() {
    if (currentIndex < vocabList.length - 1) { currentIndex++; render(); }
}

function prevWord() {
    if (currentIndex > 0) { currentIndex--; render(); }
}

render();
</script>
</body>
</html>
